version: '3.9'
services:
  app:
    image: node:20
    working_dir: /app/backend-node
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: accident
      POSTGRES_PASSWORD: accident
      POSTGRES_DB: accidentdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
